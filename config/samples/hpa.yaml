# This sample shows how to enable HPA (Horizontal Pod Autoscaler) for Milvus components.
# HPA allows automatic scaling of pods based on CPU/memory utilization or custom metrics.
#
# Two approaches are supported:
# 1. Native HPA spec (recommended) - Define HPA configuration directly in the component spec
# 2. replicas: -1 - Use this to let an external HPA or other controller manage replicas
#
# Note: When using native HPA spec, the operator will create and manage HPA resources automatically.
# For QueryNode in 2-deployment rolling mode, HPA is temporarily deleted during rollouts.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: my-release
spec:
  mode: cluster
  components:
    proxy:
      # Native HPA configuration (recommended approach)
      hpa:
        minReplicas: 2
        maxReplicas: 10
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
    queryNode:
      # Native HPA with multiple metrics
      hpa:
        minReplicas: 2
        maxReplicas: 20
        metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 60
        - type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 70
        behavior:
          scaleUp:
            policies:
            - type: Pods
              value: 2
              periodSeconds: 30
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
            - type: Pods
              value: 1
              periodSeconds: 60
    dataNode:
      # Set replicas to -1 to let an external HPA or other controller manage scaling
      # This requires creating a separate HPA resource (see below)
      replicas: -1
---
# Example of external HPA resource for dataNode (when using replicas: -1)
# Use this when you want full control over the HPA resource yourself
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-release-milvus-datanode-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-release-milvus-datanode
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
---
# Grouped workloads use the generated group-suffixed Deployment as the target.
# The operator does not create, update, or delete this HPA.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: grouped
spec:
  mode: cluster
  components:
    dataNode:
      groups:
        - name: zone-a
          replicas: -1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grouped-milvus-datanode-zone-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grouped-milvus-datanode-zone-a
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

# QueryNode, and every supported component under rollingMode: 3, has physical
# targets ending in -0 and -1. External HPA automation owns both target
# configurations and must be suspended before a full stop or MilvusUpgrade.
