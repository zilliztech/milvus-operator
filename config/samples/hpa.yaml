# This is a sample to deploy a standalone milvus in milvus-operator's default configurations.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: my-release
spec:
  mode: cluster
  components:
    proxy:
      # set replicas to -1 will stop operator from scaling the component
      # thus handover the scaling responsibility to HPA
      replicas: -1
---
# for more info see: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-release-milvus-proxy-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-release-milvus-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
---
# Grouped workloads use the generated group-suffixed Deployment as the target.
# The operator does not create, update, or delete this HPA.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: grouped
spec:
  mode: cluster
  components:
    dataNode:
      groups:
        - name: zone-a
          replicas: -1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grouped-milvus-datanode-zone-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grouped-milvus-datanode-zone-a
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

# QueryNode, and every supported component under rollingMode: 3, has physical
# targets ending in -0 and -1. External HPA automation owns both target
# configurations and must be suspended before a full stop or MilvusUpgrade.
