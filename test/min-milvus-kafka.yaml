---
apiVersion: v1
kind: Namespace
metadata:
  name: milvus-sit
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: milvus
  namespace: milvus-sit
  labels:
    app: milvus
spec:
  mode: "standalone"
  components:
    disableMetric: true
    standalone:
      ingress:
        labels:
          ingressLabel: value
        annotations:
          ingressAnnotation: value
        hosts: ["mc-sit.milvus.io"]
      serviceLabels:
        myLabel: value
      serviceAnnotations:
        myAnnotation: value
  dependencies:
    etcd:
      inCluster:
        deletionPolicy: Delete
        pvcDeletion: true
        values:
          replicaCount: 1
    msgStreamType: kafka
    kafka:
      inCluster:
        deletionPolicy: Delete
        pvcDeletion: true
        values:
          defaultReplicationFactor: 1
          offsetsTopicReplicationFactor: 1
          replicaCount: 1
          zookeeper:
            replicaCount: 1
    storage:
      inCluster:
        deletionPolicy: Delete
        pvcDeletion: true
        values:
          image:
            repository: pgsty/silo
            tag: RELEASE.2026-09-03T13-18-01Z
          mcImage:
            repository: pgsty/mc
            tag: RELEASE.2026-09-13T00-00-00Z
          environment:
            MINIO_ROOT_USER: $(MINIO_ACCESS_KEY)
            MINIO_ROOT_PASSWORD: $(MINIO_SECRET_KEY)
          mode: standalone
          persistence:
            size: 20Gi
  config:
    milvus:
      log:
        level: info
    component:
      proxy:
        timeTickInterval: 150
