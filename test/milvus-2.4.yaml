apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: my-release
  labels:
    app: milvus
spec:
  components:
    image: "milvusdb/milvus:v2.4.17"
    disableMetric: true
  dependencies:
    etcd:
      inCluster:
        values:
          replicaCount: 1
        deletionPolicy: Delete
        pvcDeletion: true
    storage:
      inCluster:
        values:
          image:
            repository: pgsty/silo
            tag: RELEASE.2026-09-03T13-18-01Z
          mcImage:
            repository: pgsty/mc
            tag: RELEASE.2026-09-13T00-00-00Z
          environment:
            MINIO_ROOT_USER: $(MINIO_ACCESS_KEY)
            MINIO_ROOT_PASSWORD: $(MINIO_SECRET_KEY)
          mode: standalone
          resources:
            requests:
              memory: 100Mi
          persistence:
            size: 20Gi
        deletionPolicy: Delete
        pvcDeletion: true
