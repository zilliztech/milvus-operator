---
apiVersion: v1
kind: Namespace
metadata:
  name: milvus-sit
---
apiVersion: milvus.io/v1alpha1
kind: Milvus
metadata:
  name: milvus
  namespace: milvus-sit
  labels:
    app: milvus
spec:
  disableMetric: true
  ingress:
    labels:
      ingressLabel: value
    annotations:
      ingressAnnotation: value
    hosts: ["mc-sit.milvus.io"]
  serviceLabels:
    myLabel: value
  serviceAnnotations:
    myAnnotation: value
  dependencies:
    etcd:
      inCluster:
        deletionPolicy: Delete
        pvcDeletion: true
        values:
          replicaCount: 1
    storage:
      inCluster:
        deletionPolicy: Delete
        pvcDeletion: true
        values:
          image:
            repository: pgsty/silo
            tag: RELEASE.2026-09-03T13-18-01Z
          mcImage:
            repository: pgsty/mc
            tag: RELEASE.2026-09-13T00-00-00Z
          environment:
            MINIO_ROOT_USER: $(MINIO_ACCESS_KEY)
            MINIO_ROOT_PASSWORD: $(MINIO_SECRET_KEY)
          mode: standalone
          persistence:
            size: 20Gi
    rocksmq:
      persistence:
        enabled: true
        persistentVolumeClaim:
          spec:
            resources:
            limits:
              storage: 20Gi
  persistence:
    enabled: true
  config:
    milvus:
      log:
        level: info
    component:
      proxy:
        timeTickInterval: 150
